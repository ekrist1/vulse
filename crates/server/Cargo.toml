[package]
name = "vulse-server"
version = "0.1.1"
edition = "2024"
publish = false

[lib]
name = "vulse_server"
path = "src/lib.rs"

[[bin]]
name = "vulse"
path = "src/main.rs"

[features]
# Builds the admin UI from crates/web/dist into the binary. Run
# `trunk build --release --config crates/web/Trunk.toml` first.
embed-web = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
vulse-model = { path = "../model" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turso = "0.8.2"
turso_serverless = "0.1.3"

csv = "1.3"
calamine = "0.36"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
reqwest = { version = "0.13", features = ["json"] }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
