[package]
name = "vulse-web"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "vulse-web"
path = "src/main.rs"

[dependencies]
vulse-model = { path = "../model" }
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
gloo-net = "0.6"
gloo-timers = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures-channel = "0.3"
uuid = { version = "1", features = ["v4", "js"] }
web-sys = { version = "0.3", features = [
    "Blob",
    "Clipboard",
    "Document",
    "DomRect",
    "Element",
    "EventSource",
    "MessageEvent",
    "Navigator",
    "NodeList",
    "Location",
    "File",
    "FileList",
    "FormData",
    "History",
    "HtmlDialogElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "RequestCredentials",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Window",
    "Storage",
] }
